name: Respaldo semanal

# pg_dump del esquema public cada domingo. Se guarda como artifact por 30 días.
# El repo debe ser PRIVADO: en un repo público cualquiera podría descargar este respaldo.
on:
  schedule:
    - cron: "40 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: pg_dump
        run: |
          mkdir -p backup
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc -f "backup/rastreador-$(date +%F).dump"
        env:
          # Usar la conexión "session pooler" (5432), no la de transacciones.
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-db
          path: backup/
          retention-days: 30
