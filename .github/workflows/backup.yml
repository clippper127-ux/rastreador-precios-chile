name: Respaldo semanal

# pg_dump del esquema public cada domingo, CIFRADO con BACKUP_PASSPHRASE (AES-256, gpg) y guardado como
# artifact por 30 días. El repo es público: sin la frase, el respaldo descargado no se puede leer.
# Para restaurar: gpg --decrypt rastreador-FECHA.dump.gpg > rastreador.dump  (pide la frase) → pg_restore.
on:
  schedule:
    - cron: "40 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Instalar cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: pg_dump
        run: |
          mkdir -p backup
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta el secret BACKUP_PASSPHRASE: no se guarda un respaldo sin cifrar."; exit 1; }
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --schema=public --no-owner --no-privileges -Fc             | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE"               -o "backup/rastreador-$(date +%F).dump.gpg"
          ls -la backup
        env:
          # Usar la conexión "session pooler" (5432), no la de transacciones.
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-db
          path: backup/
          retention-days: 30
