name: Radar

# Radar de ofertas de Telegram cada 10 min (repo público: minutos ilimitados). Lee canales, grupos de la
# cuenta dedicada y mensajes del bot. Si el radar del PC está activo (latido < 3 min), la pasada se salta.
# GitHub atrasa los cron: un despertador en Supabase (pg_cron) también la lanza por workflow_dispatch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ¿Radar del PC activo?
        id: live
        run: |
          if curl -fsS --max-time 10 "${{ vars.APP_URL }}/api/health" | grep -q '"radarLive":true'; then
            echo "El radar en tiempo real del PC está activo: se salta esta pasada."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.live.outputs.skip != 'true'
      - uses: pnpm/action-setup@v4
        if: steps.live.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.live.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.live.outputs.skip != 'true'
      - run: pnpm radar:once
        if: steps.live.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          APP_URL: ${{ vars.APP_URL }}
          WORKER_USER_AGENT: ${{ vars.WORKER_USER_AGENT }}
