  - esbuild
  - sharp
  - unrs-resolver

# Seguridad: drizzle-kit trae un esbuild antiguo (GHSA-67mh-4wv8-2f99, solo afecta su servidor de desarrollo).
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.12"
